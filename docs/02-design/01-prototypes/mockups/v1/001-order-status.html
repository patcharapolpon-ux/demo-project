<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สถานะออเดอร์ - สั่งกาแฟจากโต๊ะ QR</title>
<!--
  Mockup: หน้าสถานะออเดอร์แบบ real-time (ขั้นตอน 6-11 ใน user journey)
  Requirement: docs/01-requirements/01-spec/20260802-001-table-qr-ordering.md (20260802-001)
  Journey: docs/02-design/01-prototypes/20260802-001-table-qr-ordering-journey.md
  บทบาท: ลูกค้า — เห็นสถานะออเดอร์ (รับออเดอร์แล้ว -> กำลังทำ -> เสร็จแล้ว -> เสิร์ฟแล้ว) แบบ real-time บน primary view ตาม business rule
  State เริ่มต้นเมื่อยังไม่มีข้อมูลใน localStorage: "รับออเดอร์แล้ว"

  หมายเหตุ interactive prototype (2026-08-16): เชื่อมโยง 4 หน้าจอผ่าน vanilla JS + localStorage (ไม่มี backend จริง)
  - อ่านสถานะปัจจุบันจาก localStorage key "coffeeOrderStatus" ทุกครั้งที่โหลดหน้า (default "รับออเดอร์แล้ว" ถ้ายังไม่มีค่า)
  - Step indicator/status badge ไล่สีตาม token: pending #999999, progress (#FF6B00) ตาม color-status-progress, done #2E7D32
  - ปุ่ม secondary "จำลองขั้นถัดไป" เลื่อนสถานะไปขั้นถัดไปตามลำดับ รับออเดอร์แล้ว -> กำลังทำ -> เสร็จแล้ว -> เสิร์ฟแล้ว แล้วบันทึกกลับ localStorage; เมื่อถึง "เสิร์ฟแล้ว" ปุ่มจะ disabled
  - ปุ่ม "สั่งเพิ่มเมนู" navigate กลับ 001-menu.html ตามปกติ
  - ดุลยพินิจเพิ่มเติม: รายการที่สั่ง (order-card) อ่านจาก localStorage key "coffeeLastOrder" ที่บันทึกไว้ตอนกดยืนยันสั่งจากหน้าตะกร้า ถ้ายังไม่มี (เช่น เปิดหน้านี้ตรง ๆ โดยไม่ผ่าน flow ตะกร้า) จะ fallback เป็นข้อมูลตัวอย่างเดิมของ mockup นี้ (ลาเต้เย็น + บราวนี่ ยอดรวม ฿135)
-->
<style>
  :root {
    --color-primary: #FF6B00;
    --color-secondary: #000000;
    --color-background: #FFFFFF;
    --color-text-primary: #111111;
    --color-text-secondary: #666666;
    --color-status-pending: #999999;
    --color-status-progress: #FF6B00;
    --color-status-done: #2E7D32;
    --color-status-unavailable: #B00020;

    --font-family-base: 'Noto Sans Thai', 'IBM Plex Sans Thai', sans-serif;
    --font-size-h1: 28px;
    --font-size-h2: 22px;
    --font-size-h3: 18px;
    --font-size-body: 16px;
    --font-size-caption: 14px;
    --font-size-button: 16px;

    --space-small: 8px;
    --space-medium: 16px;
    --space-large: 24px;

    --radius-button: 12px;
    --radius-card: 16px;
    --radius-input: 8px;

    --shadow-card: 0 2px 8px rgba(0,0,0,0.08);
    --touch-target-min: 44px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-family-base);
    background: #FAFAFA;
    color: var(--color-text-primary);
    font-size: var(--font-size-body);
    line-height: 1.5;
    padding-bottom: var(--space-large);
  }
  h1 { font-size: var(--font-size-h1); font-weight: 700; }
  h2 { font-size: var(--font-size-h2); font-weight: 700; }
  h3 { font-size: var(--font-size-h3); font-weight: 700; }

  .topbar {
    background: var(--color-background);
    padding: var(--space-medium);
    display: flex;
    flex-direction: column;
    gap: 4px;
    box-shadow: var(--shadow-card);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar .table-badge {
    font-size: var(--font-size-caption);
    color: var(--color-text-secondary);
  }
  .live-indicator {
    display: inline-flex;
    align-items: center;
    gap: var(--space-small);
    font-size: var(--font-size-caption);
    color: var(--color-text-secondary);
  }
  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--color-status-progress);
  }

  .status-hero {
    padding: var(--space-large) var(--space-medium);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-small);
    text-align: center;
  }
  .status-badge-large {
    display: inline-flex;
    align-items: center;
    gap: var(--space-small);
    padding: var(--space-small) var(--space-large);
    border-radius: 999px;
    font-size: var(--font-size-h3);
    font-weight: 700;
  }
  .status-badge-large::before {
    content: '';
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .status-badge-large.status-pending {
    background: rgba(153,153,153,0.15);
    color: var(--color-status-pending);
  }
  .status-badge-large.status-pending::before { background: var(--color-status-pending); }
  .status-badge-large.status-progress {
    background: rgba(255,107,0,0.15);
    color: var(--color-status-progress);
  }
  .status-badge-large.status-progress::before { background: var(--color-status-progress); }
  .status-badge-large.status-done {
    background: rgba(46,125,50,0.15);
    color: var(--color-status-done);
  }
  .status-badge-large.status-done::before { background: var(--color-status-done); }
  .status-hero p {
    color: var(--color-text-secondary);
    font-size: var(--font-size-caption);
  }

  .step-indicator {
    display: flex;
    padding: 0 var(--space-large) var(--space-large);
  }
  .step {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-small);
    position: relative;
  }
  .step:not(:last-child)::after {
    content: '';
    position: absolute;
    top: 16px;
    left: 50%;
    width: 100%;
    height: 3px;
    background: #E0E0E0;
    z-index: 0;
  }
  .step.completed:not(:last-child)::after {
    background: var(--color-status-done);
  }
  .step-dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #E0E0E0;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: var(--font-size-caption);
    z-index: 1;
  }
  .step.completed .step-dot {
    background: var(--color-status-done);
  }
  .step.active .step-dot {
    background: var(--color-status-progress);
  }
  .step-label {
    font-size: var(--font-size-caption);
    color: var(--color-text-secondary);
    text-align: center;
  }
  .step.completed .step-label,
  .step.active .step-label {
    color: var(--color-text-primary);
    font-weight: 500;
  }

  .order-card {
    margin: 0 var(--space-medium) var(--space-medium);
    background: var(--color-background);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: var(--space-medium);
  }
  .order-card h2 {
    margin-bottom: var(--space-medium);
  }
  .order-line {
    display: flex;
    justify-content: space-between;
    padding: var(--space-small) 0;
    border-bottom: 1px solid #F0F0F0;
  }
  .order-line:last-child { border-bottom: none; }
  .order-line .name { font-weight: 500; }
  .order-line .options {
    display: block;
    font-size: var(--font-size-caption);
    color: var(--color-text-secondary);
  }
  .order-total {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: var(--font-size-h3);
    margin-top: var(--space-medium);
    padding-top: var(--space-medium);
    border-top: 1px solid #E0E0E0;
  }

  .btn-secondary {
    display: block;
    width: calc(100% - (var(--space-medium) * 2));
    margin: 0 var(--space-medium) var(--space-medium);
    background: transparent;
    color: var(--color-secondary);
    border: 1px solid var(--color-secondary);
    border-radius: var(--radius-button);
    font-size: var(--font-size-button);
    font-weight: 500;
    min-height: var(--touch-target-min);
    padding: var(--space-medium);
    cursor: pointer;
    text-align: center;
  }
  .btn-secondary:last-child { margin-bottom: 0; }
  .btn-secondary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
</style>
</head>
<body>

  <header class="topbar">
    <span class="table-badge">โต๊ะ 5 · ออเดอร์ #0231</span>
    <h1>สถานะออเดอร์ของคุณ</h1>
    <span class="live-indicator"><span class="live-dot"></span>อัปเดตอัตโนมัติแบบเรียลไทม์ ไม่ต้องกดรีเฟรช</span>
  </header>

  <section class="status-hero">
    <span class="status-badge-large" id="statusBadge">รับออเดอร์แล้ว</span>
    <p id="statusDescription">ออเดอร์เข้าคิวบาริสต้าแล้ว รอเริ่มทำ</p>
  </section>

  <section class="step-indicator" id="stepIndicator">
    <div class="step" data-step="0">
      <span class="step-dot">✓</span>
      <span class="step-label">รับออเดอร์แล้ว</span>
    </div>
    <div class="step" data-step="1">
      <span class="step-dot">2</span>
      <span class="step-label">กำลังทำ</span>
    </div>
    <div class="step" data-step="2">
      <span class="step-dot">3</span>
      <span class="step-label">เสร็จแล้ว</span>
    </div>
    <div class="step" data-step="3">
      <span class="step-dot">4</span>
      <span class="step-label">เสิร์ฟแล้ว</span>
    </div>
  </section>

  <section class="order-card">
    <h2>รายการที่สั่ง</h2>
    <div id="orderLines"></div>
    <div class="order-total">
      <span>ยอดรวม</span>
      <span id="orderTotal">฿135</span>
    </div>
  </section>

  <button class="btn-secondary" id="nextStatusBtn" type="button">จำลองขั้นถัดไป</button>
  <button class="btn-secondary" id="orderMoreBtn" type="button">สั่งเพิ่มเมนู</button>

  <script>
    (function () {
      var STATUS_KEY = 'coffeeOrderStatus';
      var LAST_ORDER_KEY = 'coffeeLastOrder';

      var STATUSES = ['รับออเดอร์แล้ว', 'กำลังทำ', 'เสร็จแล้ว', 'เสิร์ฟแล้ว'];
      var STATUS_DESCRIPTIONS = {
        'รับออเดอร์แล้ว': 'ออเดอร์เข้าคิวบาริสต้าแล้ว รอเริ่มทำ',
        'กำลังทำ': 'บาริสต้ากำลังเตรียมเครื่องดื่ม/อาหารของคุณ',
        'เสร็จแล้ว': 'เตรียมเสร็จแล้ว รอพนักงานเสิร์ฟนำไปเสิร์ฟที่โต๊ะ',
        'เสิร์ฟแล้ว': 'เสิร์ฟที่โต๊ะเรียบร้อยแล้ว ขอบคุณที่ใช้บริการ'
      };
      var STATUS_BADGE_CLASS = {
        'รับออเดอร์แล้ว': 'status-pending',
        'กำลังทำ': 'status-progress',
        'เสร็จแล้ว': 'status-done',
        'เสิร์ฟแล้ว': 'status-done'
      };

      var DEFAULT_ORDER = {
        items: [
          { name: 'ลาเต้เย็น', qty: 1, optionsText: 'ขนาด M · หวาน 50% · นมสด · เพิ่มช็อตเอสเพรสโซ', totalPrice: 85 },
          { name: 'บราวนี่', qty: 1, optionsText: '', totalPrice: 50 }
        ],
        total: 135
      };

      function formatBaht(amount) {
        return '฿' + amount;
      }

      function getStatus() {
        var status = localStorage.getItem(STATUS_KEY);
        return (status && STATUSES.indexOf(status) !== -1) ? status : STATUSES[0];
      }

      function getLastOrder() {
        try {
          var raw = localStorage.getItem(LAST_ORDER_KEY);
          return raw ? JSON.parse(raw) : DEFAULT_ORDER;
        } catch (e) {
          return DEFAULT_ORDER;
        }
      }

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function renderOrderLines() {
        var order = getLastOrder();
        var container = document.getElementById('orderLines');
        container.innerHTML = '';
        order.items.forEach(function (item) {
          var line = document.createElement('div');
          line.className = 'order-line';
          var optionsHtml = item.optionsText ? '<span class="options">' + escapeHtml(item.optionsText) + '</span>' : '';
          line.innerHTML =
            '<div><span class="name">' + escapeHtml(item.name) + ' x' + item.qty + '</span>' + optionsHtml + '</div>' +
            '<span>' + formatBaht(item.totalPrice) + '</span>';
          container.appendChild(line);
        });
        document.getElementById('orderTotal').textContent = formatBaht(order.total);
      }

      function renderStatus() {
        var status = getStatus();
        var index = STATUSES.indexOf(status);

        var badge = document.getElementById('statusBadge');
        badge.textContent = status;
        badge.className = 'status-badge-large ' + STATUS_BADGE_CLASS[status];

        document.getElementById('statusDescription').textContent = STATUS_DESCRIPTIONS[status];

        document.querySelectorAll('.step').forEach(function (stepEl) {
          var stepIndex = Number(stepEl.dataset.step);
          stepEl.classList.remove('completed', 'active');
          var dot = stepEl.querySelector('.step-dot');
          if (stepIndex < index) {
            stepEl.classList.add('completed');
            dot.textContent = '✓';
          } else if (stepIndex === index) {
            stepEl.classList.add('active');
            dot.textContent = String(stepIndex + 1);
          } else {
            dot.textContent = String(stepIndex + 1);
          }
        });

        var nextBtn = document.getElementById('nextStatusBtn');
        nextBtn.disabled = index >= STATUSES.length - 1;
      }

      function bindNextStatusButton() {
        document.getElementById('nextStatusBtn').addEventListener('click', function () {
          var status = getStatus();
          var index = STATUSES.indexOf(status);
          if (index < STATUSES.length - 1) {
            var nextStatus = STATUSES[index + 1];
            localStorage.setItem(STATUS_KEY, nextStatus);
            renderStatus();
          }
        });
      }

      function bindOrderMoreButton() {
        document.getElementById('orderMoreBtn').addEventListener('click', function () {
          window.location.href = '001-menu.html';
        });
      }

      document.addEventListener('DOMContentLoaded', function () {
        renderOrderLines();
        renderStatus();
        bindNextStatusButton();
        bindOrderMoreButton();
      });
    })();
  </script>

</body>
</html>
