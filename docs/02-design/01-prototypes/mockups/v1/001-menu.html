<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เมนู - สั่งกาแฟจากโต๊ะ QR</title>
<!--
  Mockup: หน้าเมนู (ขั้นตอน 2-4 ใน user journey)
  Requirement: docs/01-requirements/01-spec/20260802-001-table-qr-ordering.md (20260802-001)
  Journey: docs/02-design/01-prototypes/20260802-001-table-qr-ordering-journey.md
  บทบาท: ลูกค้า — เปิดหน้าเว็บหลังสแกน QR, เห็นเมนูแยกหมวด, เห็นสถานะ "หมด" ทันที, มีปุ่ม/ไอคอนตะกร้า

  หมายเหตุ interactive prototype (2026-08-16): เชื่อมโยง 4 หน้าจอผ่าน vanilla JS + localStorage (ไม่มี backend จริง)
  - กดการ์ดเมนูที่ไม่ "หมด" -> navigate ไป 001-product-detail.html?item={slug}
  - เมนู "หมด" กดไม่ได้ (ไม่ผูก click listener)
  - ไอคอนตะกร้ามุมบนแสดงจำนวนชิ้นจริงจาก localStorage key "coffeeOrderCart" (อ่านทุกครั้งที่โหลดหน้า), กดแล้ว navigate ไป 001-cart.html
-->
<style>
  :root {
    --color-primary: #FF6B00;
    --color-secondary: #000000;
    --color-background: #FFFFFF;
    --color-text-primary: #111111;
    --color-text-secondary: #666666;
    --color-status-pending: #999999;
    --color-status-progress: #FF6B00;
    --color-status-done: #2E7D32;
    --color-status-unavailable: #B00020;

    --font-family-base: 'Noto Sans Thai', 'IBM Plex Sans Thai', sans-serif;
    --font-size-h1: 28px;
    --font-size-h2: 22px;
    --font-size-h3: 18px;
    --font-size-body: 16px;
    --font-size-caption: 14px;
    --font-size-button: 16px;

    --space-small: 8px;
    --space-medium: 16px;
    --space-large: 24px;

    --radius-button: 12px;
    --radius-card: 16px;
    --radius-input: 8px;

    --shadow-card: 0 2px 8px rgba(0,0,0,0.08);
    --touch-target-min: 44px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-family-base);
    background: #FAFAFA;
    color: var(--color-text-primary);
    font-size: var(--font-size-body);
    line-height: 1.5;
    padding-bottom: var(--space-large);
  }
  h1 { font-size: var(--font-size-h1); font-weight: 700; }
  h2 { font-size: var(--font-size-h2); font-weight: 700; }
  h3 { font-size: var(--font-size-h3); font-weight: 700; }

  .topbar {
    background: var(--color-background);
    padding: var(--space-medium);
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-card);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar-title { display: flex; flex-direction: column; gap: 4px; }
  .table-badge {
    font-size: var(--font-size-caption);
    color: var(--color-text-secondary);
  }
  .cart-icon-btn {
    position: relative;
    min-width: var(--touch-target-min);
    min-height: var(--touch-target-min);
    border: none;
    background: var(--color-background);
    font-size: 24px;
    cursor: pointer;
  }
  .cart-count {
    position: absolute;
    top: 2px;
    right: 2px;
    background: var(--color-primary);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    min-width: 18px;
    height: 18px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }

  .category-tabs {
    display: flex;
    gap: var(--space-small);
    padding: var(--space-medium);
    overflow-x: auto;
  }
  .tab {
    flex-shrink: 0;
    border: 1px solid var(--color-secondary);
    background: var(--color-background);
    color: var(--color-secondary);
    border-radius: var(--radius-button);
    padding: var(--space-small) var(--space-medium);
    font-size: var(--font-size-body);
    min-height: var(--touch-target-min);
    cursor: pointer;
  }
  .tab.active {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: #fff;
    font-weight: 500;
  }

  .menu-section {
    padding: 0 var(--space-medium) var(--space-large);
  }
  .menu-section h2 {
    margin-bottom: var(--space-medium);
  }
  .menu-card {
    display: flex;
    align-items: center;
    gap: var(--space-medium);
    background: var(--color-background);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: var(--space-medium);
    margin-bottom: var(--space-medium);
  }
  .menu-card.clickable { cursor: pointer; }
  .menu-card.unavailable { cursor: not-allowed; }
  .menu-card-image {
    flex-shrink: 0;
    width: 64px;
    height: 64px;
    border-radius: var(--radius-card);
    background: #FFF1E6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }
  .menu-card-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .menu-card-info .price {
    color: var(--color-text-primary);
    font-weight: 700;
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: var(--space-small);
    padding: 2px var(--space-small);
    border-radius: 999px;
    font-size: var(--font-size-caption);
    font-weight: 500;
    width: fit-content;
  }
  .status-badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .status-unavailable { background: rgba(176,0,32,0.15); color: var(--color-status-unavailable); }
  .status-unavailable::before { background: var(--color-status-unavailable); }

  .btn-add {
    flex-shrink: 0;
    min-width: var(--touch-target-min);
    min-height: var(--touch-target-min);
    border-radius: var(--radius-button);
    border: none;
    background: var(--color-primary);
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-add:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .menu-card.unavailable .menu-card-image { opacity: 0.5; }
</style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-title">
      <span class="table-badge">โต๊ะ 5</span>
      <h1>เมนูร้านกาแฟ</h1>
    </div>
    <button class="cart-icon-btn" aria-label="ตะกร้าสินค้า">
      🛒
      <span class="cart-count">0</span>
    </button>
  </header>

  <nav class="category-tabs">
    <button class="tab active">กาแฟ</button>
    <button class="tab">เครื่องดื่มอื่น ๆ</button>
    <button class="tab">ของหวาน/เบเกอรี่</button>
  </nav>

  <main>
    <section class="menu-section">
      <h2>กาแฟ</h2>

      <div class="menu-card" data-slug="latte-hot" data-available="true">
        <div class="menu-card-image">☕</div>
        <div class="menu-card-info">
          <h3>ลาเต้ร้อน</h3>
          <p class="price">฿55</p>
        </div>
        <button class="btn-add" aria-label="เพิ่มลาเต้ร้อนลงตะกร้า">+</button>
      </div>

      <div class="menu-card" data-slug="latte-iced" data-available="true">
        <div class="menu-card-image">🧊</div>
        <div class="menu-card-info">
          <h3>ลาเต้เย็น</h3>
          <p class="price">฿60</p>
        </div>
        <button class="btn-add" aria-label="เพิ่มลาเต้เย็นลงตะกร้า">+</button>
      </div>

      <div class="menu-card unavailable" data-slug="cappuccino-iced" data-available="false">
        <div class="menu-card-image">☕</div>
        <div class="menu-card-info">
          <h3>คาปูชิโน่เย็น</h3>
          <p class="price">฿60</p>
          <span class="status-badge status-unavailable">หมด</span>
        </div>
        <button class="btn-add" disabled aria-label="คาปูชิโน่เย็นหมดชั่วคราว">+</button>
      </div>

      <div class="menu-card" data-slug="americano" data-available="true">
        <div class="menu-card-image">☕</div>
        <div class="menu-card-info">
          <h3>อเมริกาโน่</h3>
          <p class="price">฿45</p>
        </div>
        <button class="btn-add" aria-label="เพิ่มอเมริกาโน่ลงตะกร้า">+</button>
      </div>
    </section>

    <section class="menu-section">
      <h2>เครื่องดื่มอื่น ๆ</h2>

      <div class="menu-card" data-slug="chocolate-iced" data-available="true">
        <div class="menu-card-image">🍫</div>
        <div class="menu-card-info">
          <h3>ช็อกโกแลตเย็น</h3>
          <p class="price">฿60</p>
        </div>
        <button class="btn-add" aria-label="เพิ่มช็อกโกแลตเย็นลงตะกร้า">+</button>
      </div>

      <div class="menu-card" data-slug="matcha-latte" data-available="true">
        <div class="menu-card-image">🍵</div>
        <div class="menu-card-info">
          <h3>ชาเขียวลาเต้</h3>
          <p class="price">฿60</p>
        </div>
        <button class="btn-add" aria-label="เพิ่มชาเขียวลาเต้ลงตะกร้า">+</button>
      </div>
    </section>

    <section class="menu-section">
      <h2>ของหวาน/เบเกอรี่</h2>

      <div class="menu-card" data-slug="brownie" data-available="true">
        <div class="menu-card-image">🍰</div>
        <div class="menu-card-info">
          <h3>บราวนี่</h3>
          <p class="price">฿50</p>
        </div>
        <button class="btn-add" aria-label="เพิ่มบราวนี่ลงตะกร้า">+</button>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var CART_KEY = 'coffeeOrderCart';

      function getCart() {
        try {
          var raw = localStorage.getItem(CART_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch (e) {
          return [];
        }
      }

      function updateCartBadge() {
        var cart = getCart();
        var totalQty = cart.reduce(function (sum, item) { return sum + (Number(item.qty) || 1); }, 0);
        var badge = document.querySelector('.cart-count');
        if (badge) badge.textContent = String(totalQty);
      }

      document.addEventListener('DOMContentLoaded', function () {
        updateCartBadge();

        document.querySelectorAll('.menu-card').forEach(function (card) {
          var isAvailable = card.dataset.available !== 'false';
          if (isAvailable) {
            card.classList.add('clickable');
            card.addEventListener('click', function () {
              var slug = card.dataset.slug;
              window.location.href = '001-product-detail.html?item=' + encodeURIComponent(slug);
            });
          }
        });

        var cartBtn = document.querySelector('.cart-icon-btn');
        if (cartBtn) {
          cartBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            window.location.href = '001-cart.html';
          });
        }
      });
    })();
  </script>

</body>
</html>
